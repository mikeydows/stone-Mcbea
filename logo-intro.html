<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stone &amp; McBea Creative - Logo Intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;800&display=swap" rel="stylesheet">
<style>

  :root {
    --bg: #ffffff;  --fg: #000000;       /* start */
    --bg-end: #000000; --fg-end: #ffffff; /* after invert */
    --size: clamp(26px, 6.2vw, 64px);     /* master size: everything scales from this */
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }

  .stage {
    min-height: 100vh; min-height: 100dvh;
    display: grid; place-items: center;
    background: var(--bg); color: var(--fg);
    overflow: hidden; cursor: pointer;
    transition: background-color .5s ease, color .5s ease;
  }
  .stage.inverted { background: var(--bg-end); color: var(--fg-end); }

  .logo {
    position: relative;
    display: flex; flex-direction: column; align-items: center;
    font-family: "Montserrat", "Poppins", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    font-size: var(--size);
    line-height: 1;
    opacity: 0;               /* shown by JS after measuring */
  }
  .logo.ready { opacity: 1; }

  .mark-box { position: relative; display: block; }
  .mark { display: block; height: 2.35em; width: auto; overflow: visible; fill: currentColor; }
  .mark-shape { clip-path: none; }

  .lines { margin-top: 1.25em; display: flex; flex-direction: column; align-items: center; }
  .mask { overflow: hidden; padding: .08em 0; }
  .l1 { display: block; font-weight: 800; letter-spacing: .005em; white-space: nowrap; text-transform: uppercase; }
  .l2 { display: block; font-weight: 400; white-space: nowrap; text-transform: uppercase; margin-top: .5em; }

  .hint { position: fixed; bottom: 16px; left: 0; right: 0; text-align: center;
          font: 12px system-ui, sans-serif; opacity: .35; pointer-events: none; letter-spacing: .04em; }
</style>
</head>
<body>
<div class="stage" id="stage" aria-label="Logo animation">
  <div class="logo" id="logo" role="img" aria-label="Stone &amp; McBea Creative">

    <!-- Your mark, traced from your logo file -->
    <div class="mark-box" id="markBox">
      <svg class="mark" viewBox="0 0 203.4 206.8" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path id="markShape" class="mark-shape" fill-rule="evenodd" d="M192.0 86.0L188.4 81.2L184.1 76.5L179.9 72.8L175.2 69.4L170.1 66.3L165.4 64.0L159.2 61.8L152.2 59.8L145.2 58.5L134.2 57.6L102.8 57.5L98.8 57.8L94.4 58.6L90.5 59.8L87.1 61.2L83.3 63.7L79.7 66.7L77.1 69.9L75.3 73.2L73.9 77.9L73.4 83.1L74.0 86.0L74.7 87.1L75.6 87.8L77.0 88.3L79.1 88.5L131.6 88.4L138.8 88.9L144.5 90.3L149.9 92.7L154.7 96.2L158.6 100.4L162.0 105.6L164.2 110.6L166.1 118.0L166.8 124.5L166.8 136.1L165.8 144.0L164.8 147.6L163.7 150.8L162.0 154.2L160.1 157.5L158.0 160.2L155.6 162.7L152.7 165.0L149.4 167.2L146.5 168.6L143.2 169.8L136.0 171.3L130.1 171.6L64.8 171.7L60.1 171.4L55.4 170.5L50.9 168.8L47.1 166.5L43.8 163.0L41.2 159.0L39.9 155.5L39.0 150.9L38.7 147.2L38.5 136.0L38.2 134.4L37.5 133.3L35.8 132.1L28.6 129.7L23.4 127.2L17.4 123.7L10.8 118.7L9.5 118.2L8.3 118.1L6.9 118.7L5.5 120.0L4.2 121.8L3.2 124.0L1.3 130.9L0.3 137.9L0.3 157.8L0.8 168.6L1.4 173.0L2.4 177.8L3.6 181.4L5.1 184.6L8.0 189.2L11.5 193.5L15.3 196.9L19.5 199.9L24.1 202.3L29.4 204.2L35.0 205.5L41.5 206.4L49.2 206.7L144.1 206.6L151.0 206.0L158.6 204.4L165.1 202.2L171.6 199.2L177.2 195.8L182.5 191.6L186.7 187.2L191.2 181.2L194.6 175.1L197.4 168.9L200.1 161.0L201.8 153.2L203.0 143.8L203.4 133.1L203.1 121.2L202.3 113.1L200.9 105.9L198.6 98.8L195.9 92.8ZM0.9 39.4L0.3 44.8L0.0 51.8L0.0 68.5L0.4 81.8L1.2 87.5L2.4 92.6L4.2 97.6L6.5 102.4L10.1 107.9L14.2 112.6L18.8 116.6L24.6 120.5L30.5 123.6L36.6 125.9L44.5 128.0L52.2 129.4L59.6 130.0L115.8 130.1L120.5 129.9L123.8 129.4L126.9 128.5L129.6 127.1L131.9 125.3L134.0 123.0L135.7 120.1L136.9 117.1L137.6 114.1L137.7 110.5L137.3 106.0L136.7 104.0L135.8 102.3L134.6 100.7L133.2 99.5L131.6 98.6L129.9 98.1L125.8 97.8L69.1 97.7L62.5 97.5L57.2 96.7L52.8 95.5L48.9 93.6L45.6 91.2L43.1 88.5L41.1 85.6L39.6 82.2L38.5 78.4L37.8 73.9L37.4 69.4L37.4 59.8L37.7 55.0L38.3 51.0L39.2 47.5L40.3 44.2L41.7 41.6L43.8 38.9L46.3 36.4L49.0 34.3L52.0 32.6L56.1 30.9L60.2 29.7L64.0 29.2L69.4 28.8L128.1 28.7L136.0 29.4L1         <g id="dotWrap" opacity="0"><circle id="dot" cx="101.7" cy="103.4" r="9"/></g>
      </svg>
    </div>

    <div class="lines" id="lines">
      <div class="mask"><span class="l1" id="l1"></span></div>
      <div class="mask"><span class="l2" id="l2"></span></div>
    </div>
  </div>
</div>
<div class="hint">click to replay</div>

<script>
(() => {
  /* ---------- CONFIG ---------- */
  const LINE_1 = "Stone & McBea";
  const LINE_2 = "Creative";
  const INTRO_SCALE = 2.1;     // size of the mark during the intro
  const INVERT = true;         // flip to light-on-dark mid-animation
  const AUTOPLAY = true;
  /* ---------------------------- */

  const $ = id => document.getElementById(id);
  const stage = $("stage"), logo = $("logo"), markBox = $("markBox");
  const shape = $("markShape"), dotWrap = $("dotWrap"), dot = $("dot");
  const l1 = $("l1"), l2 = $("l2"), lines = $("lines");
  l1.textContent = LINE_1; l2.textContent = LINE_2;

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let anims = [], timers = [];
  const run = (el, kf, o) => { const a = el.animate(kf, { fill: "both", ...o }); anims.push(a); return a; };
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));

  function reset() {
    anims.forEach(a => a.cancel()); timers.forEach(clearTimeout);
    anims = []; timers = [];
    stage.classList.remove("inverted");
    l2.style.letterSpacing = "0px"; l2.style.marginRight = "0px";
  }

  // Make "CREATIVE" span exactly the same width as the bold line
  function fitLine2() {
    l2.style.letterSpacing = "0px"; l2.style.marginRight = "0px";
    const target = l1.getBoundingClientRect().width;
    const natural = l2.getBoundingClientRect().width;
    const gaps = Math.max(l2.textContent.length - 1, 1);
    const ls = (target - natural) / gaps;          // spacing between letters
    l2.style.letterSpacing = ls + "px";
    l2.style.marginRight = (-ls) + "px";          // cancel trailing space so it stays centred
  }

  function play() {
    reset();
    fitLine2();
    const wrapH = logo.offsetHeight;
    const markCy = markBox.offsetTop + markBox.offsetHeight / 2;
    const dy = wrapH / 2 - markCy;                 // moves mark to the viewport centre
    logo.style.transformOrigin = `50% ${markCy}px`;
    logo.classList.add("ready");

    const hidden = () => {
      run(l1, [{ transform: "translateY(115%)" }], { duration: 1 });
      run(l2.parentElement, [{ clipPath: "inset(0 50% 0 50%)" }], { duration: 1 });
    };

    if (reduce) {
      if (INVERT) stage.classList.add("inverted");
      window.dispatchEvent(new Event("logo-intro:done"));
      return;
    }

    const startT = `translateY(${dy}px) scale(${INTRO_SCALE})`;
    const T_REVEAL = 3150;
    run(logo, [{ transform: startT }, { transform: startT }], { duration: T_REVEAL });
    hidden();

    /* 1) mark hidden; dot falls with squash & stretch  (0 - 1100ms) */
    run(shape, [{ clipPath: "circle(0% at 50% 50%)" }, { clipPath: "circle(0% at 50% 50%)" }], { duration: 1100 });
    run(dotWrap, [{ opacity: 1 }, { opacity: 1 }], { duration: 1150 });
    run(dot, [
      { transform: "translateY(-230px) scale(0)",     offset: 0,    easing: "cubic-bezier(.3,1.6,.6,1)" },
      { transform: "translateY(-230px) scale(1)",     offset: .2,   easing: "cubic-bezier(.55,0,1,.6)" },
      { transform: "translateY(-12px) scale(.7,1.8)", offset: .68,  easing: "linear" },
      { transform: "translateY(0) scale(1.9,.45)",    offset: .82,  easing: "cubic-bezier(.2,.8,.4,1)" },
      { transform: "translateY(0) scale(1,1)",        offset: 1 }
    ], { duration: 1100, });
    dot.style.transformOrigin = "center"; dot.style.transformBox = "fill-box";

    /* 2) dot bursts open into the mark: circular reveal from the landing point (1100 - 1850ms) */
    run(dotWrap, [{ opacity: 1 }, { opacity: 0 }], { delay: 1200, duration: 350 });
    run(shape, [
      { clipPath: "circle(0% at 50% 50%)" },
      { clipPath: "circle(78% at 50% 50%)" }
    ], { delay: 1100, duration: 750, easing: "cubic-bezier(.45,0,.15,1)" });
    // little pop on the mark itself
    run(markBox, [
      { transform: "scale(.88)" }, { transform: "scale(1.04)", offset: .6 }, { transform: "scale(1)" }
    ], { delay: 1100, duration: 900, easing: "cubic-bezier(.3,.7,.3,1)" });

    /* 3) invert  (2450ms) */
    if (INVERT) later(() => stage.classList.add("inverted"), 2450);

    /* 4) reveal: mark scales down to its place, text appears  (3150ms+) */
    const ease = "cubic-bezier(.7,0,.15,1)";
    run(logo, [{ transform: startT }, { transform: "translateY(0) scale(1)" }],
        { delay: T_REVEAL, duration: 1000, easing: ease });
    run(l1, [{ transform: "translateY(115%)" }, { transform: "translateY(0)" }],
        { delay: T_REVEAL + 350, duration: 800, easing: "cubic-bezier(.2,.8,.2,1)" });
    run(l2.parentElement, [{ clipPath: "inset(0 50% 0 50%)" }, { clipPath: "inset(0 0% 0 0%)" }],
        { delay: T_REVEAL + 600, duration: 900, easing: "cubic-bezier(.3,.6,.2,1)" });

    later(() => window.dispatchEvent(new Event("logo-intro:done")), T_REVEAL + 1700);
  }

  window.playLogoIntro = play;
  stage.addEventListener("click", play);

  const go = () => AUTOPLAY ? play() : logo.classList.add("ready");
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(go);
})();
</script>
</body>
</html>
